name: aaima
description: "Aplikasi mengenai asas-asas islam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # SQLite Database (NEW - For offline data storage)
  sqflite: ^2.3.3
  path: ^1.9.0

  # File & Storage
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

  # Video Player
  youtube_player_flutter: ^9.1.3

  # URL Handling
  url_launcher: ^6.3.1

  # Caching & State Management
  shared_preferences: ^2.3.2
  provider: ^6.1.2

dependency_overrides:
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets - Keep only what you need
  assets:
    # Core images
    - assets/images/
    - assets/images/home/

    # PDF Files
    - assets/files/
    - assets/files/aqidah/

  # Fonts - Using system fonts (no custom fonts needed)
  # Remove this section if you don't have custom fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #   - family: Comic Sans MS
  #     fonts:
  #       - asset: assets/fonts/ComicSansMS.ttf
  #   - family: Arabic
  #     fonts:
  #       - asset: assets/fonts/Arabic-Regular.ttf